<style>
:root{color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:#ecebf2;font:300 16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
#story{height:calc(17*2000vh);height:calc(17*2000svh);position:relative}
#stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;background:#000;--c:#fff}
.L{position:absolute;inset:0;opacity:0;pointer-events:none;will-change:transform,opacity}
#tl{opacity:1}
#lst{position:absolute;top:0;left:50%;width:min(560px,100vw);margin-left:calc(min(560px,100vw)/-2)}
#lst h3{position:absolute;top:-130px;width:100%;text-align:center;font:300 13px Inter;letter-spacing:.4em;color:#8d8ca0}
.node{display:grid;grid-template-columns:1fr 96px 1fr;align-items:center;position:relative;height:150px;--c:#fff}
.bar{position:absolute;left:50%;top:75px;width:5px;height:150px;margin-left:-2.5px;background:#2c3446;z-index:0}
.lit{position:absolute;left:0;top:0;width:100%;height:0;background:var(--bc);transition:background .8s;box-shadow:0 0 22px 3px var(--bc)}
.ring{grid-column:2;width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;background:conic-gradient(var(--c) calc(var(--p)*1%),#232a38 0);display:grid;place-items:center;color:#ecebf2;font:600 13px Inter;position:relative;pointer-events:auto}
.ring::before{content:"";position:absolute;width:76px;height:76px;border-radius:50%;background:#050509}
.ring span{position:relative;z-index:2;font-size:15px}.ring{z-index:1}
.lab{font:400 13px Inter;color:#8d8ca0}
.lab b{display:block;color:#ecebf2;font:700 16px Fraunces,serif;letter-spacing:.05em;text-transform:uppercase}
.node.nl .lab{grid-column:1;grid-row:1;text-align:right;padding-right:1.4rem}
.node.nr .lab{grid-column:3;grid-row:1;padding-left:1.4rem}
#ttl{display:grid;place-items:center;text-align:center}
#ttl>div{width:100%;padding:0 4vw}
#ttl h2{display:inline-block;white-space:nowrap;font:300 100px/1 Fraunces,serif;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 0 60px var(--c)}
#ttl p{letter-spacing:.4em;color:var(--c);font-size:12px;margin-bottom:1rem}
#hist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:3vw;align-items:center;padding:8vh 7vw}
#hl{display:grid;align-self:center}
.s{grid-area:1/1;font:300 clamp(16px,1.7vw,22px)/1.55 Fraunces,serif;color:#fff;opacity:0;visibility:hidden;border-left:2px solid var(--c);padding-left:1rem;will-change:transform,opacity}
.w{display:inline-block;will-change:transform,opacity}
.s h4{font:600 11px Inter;letter-spacing:.35em;color:var(--c);margin-bottom:.5em}
.ch{display:inline-block;margin:.25em .4em .25em 0;padding:.3em .95em;border:1px solid var(--c);border-radius:18px;font:400 .85em/1.35 Inter,sans-serif;opacity:0;transition:background .35s,box-shadow .35s;will-change:transform,opacity}
.ch.hot{background:color-mix(in srgb,var(--c) 32%,transparent);box-shadow:0 0 22px var(--c)}
.fg{perspective:900px;display:grid;place-items:center;height:50vh}
.cube{position:relative;width:200px;height:200px;transform-style:preserve-3d;will-change:transform}
.cube div{position:absolute;inset:0;border:1px solid var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 35%,transparent),rgba(0,0,0,.6));display:grid;place-items:center;text-align:center;font:italic 300 22px Fraunces,serif;backface-visibility:visible}
.cube small{display:block;font:600 11px Inter;letter-spacing:.3em;color:var(--c)}
.cube::after,.cube::before{content:"";position:absolute;left:-90px;top:-90px;width:380px;height:380px;border-radius:50%;border:1px solid var(--c);transform:rotateX(75deg);animation:sp 6s linear infinite}
.cube::before{transform:rotateY(75deg);animation-duration:9s;opacity:.5}
@keyframes sp{to{rotate:360deg}}
/* ===== cinematic entrance: light slit + anamorphic flare ===== */
#door i{position:absolute;left:50%;top:50%;display:block;pointer-events:none;will-change:transform,opacity}
#ls{width:100vw;height:3px;margin:-1px 0 0 -50vw;background:linear-gradient(90deg,transparent,#fff 18%,#fff 82%,transparent);box-shadow:0 0 16px 3px var(--c),0 0 70px 12px var(--c);opacity:0}
#lf{width:70vmax;height:50vmin;margin:-25vmin 0 0 -35vmax;background:radial-gradient(ellipse,#fff 0,var(--c) 12%,transparent 60%);mix-blend-mode:screen;filter:blur(10px);opacity:0}
#e1,#e2{width:100vw;height:2px;margin:-1px 0 0 -50vw;background:#fff;box-shadow:0 0 14px 3px var(--c),0 0 60px 8px var(--c);opacity:0}
#dl{position:absolute;left:0;top:calc(50% + 26px);width:100%;text-align:center;white-space:nowrap;font:600 12px Inter;letter-spacing:.4em;color:var(--c);padding:0 4vw}
#walk{perspective:800px;overflow:hidden}
#cam,#rm,#cds{position:absolute;inset:0;transform-style:preserve-3d}.pl{position:absolute;left:50%;top:50%;transform-origin:0 0;background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--c) 45%,transparent) 0 1px,transparent 1px 100px),repeating-linear-gradient(90deg,color-mix(in srgb,var(--c) 45%,transparent) 0 1px,transparent 1px 100px),rgba(4,4,8,.9)}
#cam{position:absolute;inset:0;transform-style:preserve-3d}
.cd{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.cd>div{position:absolute;left:-30vmin;top:-17vmin;display:flex;gap:2vmin;align-items:center;width:max-content}
.fr{width:34vmin;height:34vmin;border:.9vmin solid var(--c);outline:1px solid var(--c);outline-offset:.8vmin;background:#0b0b12;box-shadow:0 0 50px color-mix(in srgb,var(--c) 40%,transparent);flex:none;overflow:hidden}.sl{width:100%;height:100%;display:grid;place-items:center;text-align:center;font:600 1.5vmin/2 Inter;letter-spacing:.3em;color:var(--c);background:repeating-linear-gradient(45deg,#0b0b12 0 12px,#10101a 12px 24px)}.sl img{width:100%;height:100%;object-fit:cover}.sk{position:absolute;inset:0;pointer-events:none;opacity:0;transform:rotate(calc(var(--p)*3.6deg))}.sk::after{content:"";position:absolute;left:50%;top:-5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 0 20px 8px var(--c)}
.tx{width:24vmin;transition:opacity .6s,transform .6s;opacity:0;transform:translateY(20px)}
.cd.near .tx{opacity:1;transform:none}
.tx em{display:block;font:italic 400 2.6vmin/1.2 Fraunces,serif;color:#fff}
.tx small{display:block;color:var(--c);font-size:1.6vmin;letter-spacing:.2em;text-transform:uppercase;margin:.5em 0}
.tx span{font-size:1.9vmin;color:#c9c8d6}
#sp{width:100%;height:100%}
#hud{position:absolute;left:5vw;top:calc(3vh + env(safe-area-inset-top,0px));font:600 11px Inter;letter-spacing:.3em;color:var(--c);z-index:5;pointer-events:none}
#rm{display:none}#bk{position:absolute;inset:0;width:100%;height:100%;opacity:.65}#fc{width:min(46vh,100%);aspect-ratio:1;filter:drop-shadow(0 0 30px var(--c))}#mu{position:fixed;right:4vw;bottom:calc(3vh + env(safe-area-inset-bottom,0px));z-index:30;background:#0008;color:#ecebf2;border:1px solid #666;border-radius:99px;padding:.5rem 1rem;font:600 11px Inter;letter-spacing:.2em;cursor:pointer;backdrop-filter:blur(6px)}#cue{position:absolute;bottom:4vh;width:100%;text-align:center;font-size:11px;letter-spacing:.4em;color:#8d8ca0;z-index:5;pointer-events:none;animation:pu 2s infinite}
@keyframes pu{50%{opacity:.2}}
#end{padding:14vh 4vw;background:#050509;text-align:center}
#end h2{font:300 clamp(40px,8vw,100px)/1 Fraunces,serif}#end h2 b{font-style:italic}
#end .lst2{max-width:560px;margin:3rem auto 0;text-align:left}
#end .node{cursor:pointer}
.fr{position:relative}.sl img{object-fit:contain;background:#05050a}
.fr::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,#fff4 50%,transparent 62%);transform:translateX(var(--sh,-100%));box-shadow:inset 0 0 9vmin #000c}
.lb{position:absolute;left:0;width:100%;background:#000;z-index:6;pointer-events:none;height:0}#lb1{top:0}#lb2{bottom:0}
#bm{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4;background:radial-gradient(ellipse 45% 70% at 50% 0,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%);mix-blend-mode:screen}
#xt{white-space:nowrap;position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;z-index:7;font:300 clamp(24px,6vw,72px)/1.1 Fraunces,serif;text-transform:uppercase;color:#fff;text-shadow:0 0 50px var(--c);text-align:center}
#xt small{display:block;font:600 11px Inter;letter-spacing:.5em;color:var(--c);margin-top:1rem}
#lst h3 span{display:block;margin-top:.7rem;font-size:11px;letter-spacing:.25em;color:#ecebf2;text-transform:uppercase}
/* ===== phone / portrait ===== */
@media(max-aspect-ratio:1/1){
#cds{transform:scale(1.5)}
.cd>div{flex-direction:column;width:44vmin;left:-22vmin;top:-17vmin;gap:3.5vmin}
.tx{width:100%;text-align:center}
.tx em{font-size:3.6vmin}.tx small{font-size:2.2vmin}.tx span{font-size:2.9vmin}
}
@media(max-width:700px){
#story{height:calc(17*1400vh);height:calc(17*1400svh)}
#hist{padding:10vh 7vw 6vh;gap:2vh;align-content:center}
.fg{height:34vh}#fc{width:min(32vh,78vw)}
.s{font-size:17px}
.node .lab{font-size:12px}.node .lab b{font-size:14px;letter-spacing:.02em}
#xt small{letter-spacing:.22em;white-space:normal;padding:0 6vw}
#dl{letter-spacing:.22em;font-size:11px}
#mu{padding:.4rem .8rem;font-size:10px}
}
</style></head><body>

<script>
const D=`Renaissance Art|1400–1600|c. 1400–1600 (began in Italy, especially Florence).|A cultural “rebirth” that revived interest in classical antiquity, humanism, and the natural world after the Middle Ages. Artists studied anatomy, perspective, and proportion to create more realistic and idealized representations of people and space.|Linear perspective, realistic anatomy and proportion, balanced compositions, sfumato and chiaroscuro, classical themes and idealized beauty, oil painting and fresco techniques.|Leonardo da Vinci’s notebooks show he dissected human bodies to understand anatomy—something rare and risky at the time—helping create the highly realistic figures of the High Renaissance.|Mona Lisa~Leonardo da Vinci~sfumato softness;The Last Supper~Leonardo da Vinci~perspective centers Christ;Creation of Adam~Michelangelo~Sistine ceiling;School of Athens~Raphael~thinkers in ideal space;The Birth of Venus~Botticelli~myth revived;David~Michelangelo~marble ideal body;Arnolfini Portrait~Jan van Eyck~oil-paint detail
Baroque Art|1600–1750|c. 1600–1750 (began in Rome).|An energetic, dramatic style that emerged during the Catholic Counter-Reformation and absolute monarchies. It aimed to overwhelm the viewer with emotion, grandeur, and theatrical effects.|Strong contrast of light and dark (chiaroscuro/tenebrism), dynamic movement, dramatic diagonals, rich colors, ornate detail, and emotional intensity.|Caravaggio’s realistic, sometimes brutal lighting and ordinary models shocked contemporaries and heavily influenced later artists across Europe.|Calling of Saint Matthew~Caravaggio~spotlight drama;The Night Watch~Rembrandt~militia in motion;Las Meninas~Velázquez~court puzzle;Ecstasy of Saint Teresa~Bernini~marble rapture;Girl with a Pearl Earring~Vermeer~quiet light;Judith Slaying Holofernes~Artemisia Gentileschi~fierce heroine;Descent from the Cross~Rubens~diagonal drama
Rococo Art|1730–1780|c. 1720–1780 (centered in France).|A lighter, more playful reaction against the heavy drama of Baroque. It flourished in aristocratic salons and celebrated elegance, pleasure, and intimate scenes of leisure.|Pastel colors, soft curves, asymmetry, delicate ornamentation, themes of love, nature, and aristocratic playfulness.|The style is named after the French word rocaille (shell-like rockwork), reflecting the ornate shell and scroll motifs used in decoration.|The Swing~Fragonard~flirtatious fantasy;Pilgrimage to Cythera~Watteau~dreamy outing;Madame de Pompadour~Boucher~royal mistress;Marie Antoinette with a Rose~Vigée Le Brun~soft court portrait;The Blue Boy~Gainsborough~elegant English style;The Toilette of Venus~Boucher~pastel mythology;Apotheosis of the Spanish Monarchy~Tiepolo~ceiling in the sky
Classicism|1760–1830|c. 1750–1830 (strongest after the mid-18th century).|A return to the clarity, order, and moral seriousness of ancient Greek and Roman art, inspired by Enlightenment ideals and archaeological discoveries (Pompeii, Herculaneum). It rejected Rococo frivolity in favor of civic virtue and restraint.|Clean lines, balanced composition, idealized figures, sober colors, classical subjects (history, mythology, civic duty), and a sense of rational order.|Jacques-Louis David’s paintings became visual propaganda for both the French Revolution and later Napoleon’s empire.|Oath of the Horatii~Jacques-Louis David~duty over family;Death of Marat~David~revolution’s martyr;Napoleon Crossing the Alps~David~heroic propaganda;La Grande Odalisque~Ingres~elongated beauty;Oedipus and the Sphinx~Ingres~crisp mythology;Cupid and Psyche~Canova~marble tenderness;The Death of Socrates~David~calm courage
Romanticism|1800–1850|c. 1780–1850.|A reaction against Neoclassical reason and the Industrial Revolution. Artists emphasized emotion, imagination, the power of nature, the sublime, and individual experience.|Dramatic lighting and weather, intense emotion, wild or exotic landscapes, historical or literary subjects, loose brushwork, and a focus on the individual’s inner world.|Caspar David Friedrich’s lonely figures facing vast landscapes became icons of Romantic isolation and spiritual contemplation.|Wanderer above the Sea of Fog~Caspar David Friedrich~awe of nature;Liberty Leading the People~Delacroix~revolution;The Raft of the Medusa~Géricault~shipwreck horror;The Third of May 1808~Goya~war’s cruelty;The Fighting Temeraire~Turner~fading glory;The Hay Wain~Constable~English countryside;Saturn Devouring His Son~Goya~dark nightmare
Realism|1840–1880|c. 1840–1880 (especially France).|Artists rejected idealized or romanticized subjects and instead depicted ordinary people, labor, and everyday life with honesty, often with social or political undertones.|Unidealized figures, ordinary subjects (peasants, workers, urban scenes), careful observation of detail, muted or natural colors, and a focus on contemporary reality.|Gustave Courbet deliberately painted large-scale works of ordinary laborers, challenging the tradition that only history or mythology deserved grand formats.|The Stone Breakers~Courbet~hard labor;The Gleaners~Millet~poor harvesters;Olympia~Manet~gaze that shocked;The Gross Clinic~Thomas Eakins~surgery unflinching;A Burial at Ornans~Courbet~village funeral;The Third-Class Carriage~Daumier~weary passengers;Barge Haulers on the Volga~Repin~human burden
Impressionism|1860–1886|c. 1860s–1880s (France).|Artists left the studio to paint outdoors (en plein air), capturing fleeting effects of light and atmosphere rather than precise detail. The name came from a critic’s mocking review of Monet’s Impression, Sunrise.|Visible, broken brushstrokes, bright pure colors, focus on light and its changing effects, modern urban and leisure subjects, and open-air painting.|The invention of portable paint tubes in metal made outdoor painting practical for the first time, helping the movement develop.|Impression, Sunrise~Monet~the name-giver;Water Lilies~Monet~shimmering pond;Luncheon of the Boating Party~Renoir~friends in sun;The Dance Class~Degas~backstage ballet;Le Moulin de la Galette~Renoir~dappled dance;The Child’s Bath~Mary Cassatt~intimate motherhood;Boulevard Montmartre~Pissarro~city in rain
Fauvism|1905–1910|c. 1905–1908 (brief but influential).|A short-lived French movement that used intense, non-naturalistic color for emotional expression rather than realistic description. Critics called the artists fauves (“wild beasts”).|Bold, pure, often arbitrary colors, simplified forms, energetic brushwork, and expressive rather than descriptive use of color.|Henri Matisse’s Woman with a Hat (1905) caused a scandal at the Salon d’Automne because of its shocking green stripe down the face and wild color choices.|Woman with a Hat~Matisse~scandalous colour;The Joy of Life~Matisse~dreamy nudes;Charing Cross Bridge~Derain~vivid London;Open Window, Collioure~Matisse~sea in pink;The Dance~Matisse~red figures circle;The Green Stripe~Matisse~colour as shadow;The Seine at Chatou~Vlaminck~fiery river
Cubism|1907–1920s|c. 1907–1920s (pioneered in Paris).|Pablo Picasso and Georges Braque broke traditional single-point perspective, representing objects from multiple viewpoints at once and reducing forms to geometric planes.|Fragmented forms, geometric shapes, multiple simultaneous viewpoints, muted or later collage materials, and a flattened picture plane.|Picasso’s Les Demoiselles d’Avignon (1907) is often seen as the breakthrough work that launched Cubism, influenced in part by African sculpture.|Les Demoiselles d’Avignon~Picasso~the first break;Guernica~Picasso~war protest;Violin and Candlestick~Braque~shattered still life;Three Musicians~Picasso~collage colour;Portrait of Kahnweiler~Picasso~faceted dealer;Girl with a Mandolin~Picasso~fragmented music;Woman with a Guitar~Braque~layers of planes
Futurism|1909–1944|1909–c. 1916 (Italy; manifesto published 1909).|An Italian movement that celebrated speed, technology, modern machines, and violence, rejecting the past in favor of a dynamic, industrial future.|Depiction of motion and energy, overlapping forms, radiating lines, bright colors, and themes of machines, speed, and urban life.|The founder, Filippo Tommaso Marinetti, published the Futurist Manifesto on the front page of a major French newspaper, deliberately seeking scandal and publicity.|Unique Forms of Continuity in Space~Boccioni~striding bronze;Dynamism of a Dog on a Leash~Balla~tiny legs blur;The City Rises~Boccioni~workers and horses;Street Light~Balla~light as motion;Armoured Train~Severini~war machine;Dynamism of a Cyclist~Boccioni~speed lines;Funeral of the Anarchist Galli~Carrà~riot chaos
Expressionism|1905–1930s|c. 1905–1930s (strongest in Germany and Northern Europe).|Artists distorted form and color to express intense inner emotions, anxiety, and spiritual or psychological states rather than external reality.|Distorted figures and space, intense or jarring colors, heavy outlines, emotional exaggeration, and themes of isolation, fear, or spirituality.|Edvard Munch’s The Scream (1893) is often cited as a precursor; the later German groups Die Brücke and Der Blaue Reiter formalized the style.|The Scream~Edvard Munch~modern anxiety;Madonna~Munch~sensual and eerie;Street, Berlin~Kirchner~jagged city;Large Blue Horses~Franz Marc~spiritual animals;Composition VII~Kandinsky~near-abstract storm;Death and the Maiden~Egon Schiele~twisted embrace;The Prophet~Emil Nolde~carved faces
Dadaism|1916–1924|c. 1916–1924 (began in Zürich during World War I).|An anti-art movement born from the trauma and absurdity of World War I. It rejected logic, traditional aesthetics, and bourgeois values through nonsense, chance, and provocation.|Collage, ready-mades, absurdity, nonsense poetry and performance, photomontage, and deliberate anti-aesthetic gestures.|Marcel Duchamp’s Fountain (1917)—a signed urinal submitted to an exhibition—became one of the most influential and controversial works in modern art history.|Fountain~Marcel Duchamp~a urinal as art;L.H.O.O.Q.~Duchamp~Mona Lisa mustache;Cut with the Kitchen Knife~Hannah Höch~photomontage;Bicycle Wheel~Duchamp~first readymade;Gift~Man Ray~iron with tacks;Merzbild~Kurt Schwitters~trash collage;Mechanical Head~Raoul Hausmann~empty mind
Surrealism|1924–1950s|1924–1960s (officially launched with André Breton’s manifesto).|Building on Dada and Freudian ideas, Surrealists explored the unconscious, dreams, and irrational juxtapositions to free the imagination from rational control.|Dream-like or bizarre imagery, unexpected combinations of objects, precise technique mixed with fantasy, automatism, and exploration of the subconscious.|Salvador Dalí’s melting clocks in The Persistence of Memory (1931) were partly inspired by soft Camembert cheese melting in the sun.|The Persistence of Memory~Dalí~melting clocks;The Son of Man~Magritte~apple-faced man;The Treachery of Images~Magritte~“not a pipe”;The Two Fridas~Frida Kahlo~divided self;The Elephants~Dalí~spindly legs;Golconda~Magritte~raining men;The Robing of the Bride~Max Ernst~feathered fantasy
Constructivism|1913–1930s|c. 1915–1930s (Russia, especially after the 1917 Revolution).|A Russian avant-garde movement that rejected “art for art’s sake” in favor of functional, socially useful art and design using industrial materials and geometric forms to serve the new socialist society.|Geometric abstraction, industrial materials (metal, glass, wood), emphasis on construction over composition, utilitarian design (posters, architecture, textiles), and a machine aesthetic.|Vladimir Tatlin’s never-built Monument to the Third International (a towering, rotating spiral structure) became the movement’s most famous symbolic project.|Monument to the Third International~Tatlin~tower that never was;Beat the Whites with the Red Wedge~El Lissitzky~geometric propaganda;Corner Counter-Relief~Tatlin~floating materials;Books!~Rodchenko~poster of a shout;Spatial Construction No. 12~Rodchenko~hanging forms;Column~Naum Gabo~transparent geometry;Palace of Labour~Vesnin Brothers~unbuilt giant
Abstract Expressionism|1940s–1960s|c. 1940s–1950s (primarily New York).|The first major American-led international art movement. Artists emphasized spontaneous gesture, large scale, and pure emotional or spiritual expression through abstraction.|Large canvases, gestural or action painting, color fields, emphasis on process and the artist’s physical engagement, and non-representational forms.|Jackson Pollock’s “drip” technique involved laying canvases on the floor and pouring or flinging paint—making the act of painting itself a kind of performance.|Autumn Rhythm~Jackson Pollock~drip dance;No. 61 (Rust and Blue)~Rothko~glowing fields;Woman I~de Kooning~savage brush;Blue Poles~Pollock~tangled rhythm;Onement I~Barnett Newman~the “zip”;Hills of Nostalgia~Jose Joya~Filipino abstraction;Mahoning~Franz Kline~black strokes
Pop Art|1950s–1970s|c. mid-1950s–1970s (Britain and then the United States).|Artists turned to popular culture, advertising, comic books, and mass-produced consumer goods, treating everyday commercial imagery as legitimate subject matter and often with irony or detachment.|Bold colors, commercial techniques (silkscreen, Ben-Day dots), appropriation of mass-media images, consumer products, celebrities, and a cool, impersonal approach.|Andy Warhol’s Campbell’s Soup Cans (1962) deliberately treated supermarket packaging with the same seriousness traditionally reserved for high art.|Campbell’s Soup Cans~Warhol~supermarket icon;Marilyn Diptych~Warhol~fame fading;Whaam!~Lichtenstein~comic explosion;Just What Is It…?~Richard Hamilton~first pop collage;Drowning Girl~Lichtenstein~melodrama;Floor Burger~Claes Oldenburg~giant soft food;Flag~Jasper Johns~symbol repainted
Op Art|1960s|1960s (roots in the 1950s; peak mid-1960s).|A form of abstract art that uses precise geometric patterns and color relationships to create optical illusions of movement, vibration, or depth, engaging the viewer’s eye directly.|Geometric patterns (lines, grids, circles), high contrast (often black-and-white), carefully calculated color interactions, and effects that make the image appear to pulse, warp, or move.|The 1965 Museum of Modern Art exhibition The Responsive Eye made Op Art a popular sensation, influencing fashion, design, and advertising almost overnight.|Current~Bridget Riley~waves that buzz;Movement in Squares~Riley~warping grid;Fall~Riley~rippling lines;Cataract 3~Riley~colour undulation;Zebra~Victor Vasarely~striped illusion;Vega-Nor~Vasarely~bulging grid;Homage to the Square~Josef Albers~colour relationships`;
